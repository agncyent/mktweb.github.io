<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ERROR 404 - Halaman Tidak Ditemukan | MKT4X</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #c8f5e4 0%, #daf7ed 40%, #b8edd8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* BUBBLE BACKGROUND */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      animation: float 8s ease-in-out infinite;
    }
    .b1 { width:300px; height:300px; top:-80px; left:-80px; animation-delay:0s; }
    .b2 { width:200px; height:200px; bottom:-60px; right:-60px; animation-delay:2s; }
    .b3 { width:150px; height:150px; top:30%; right:10%; animation-delay:4s; }
    .b4 { width:100px; height:100px; bottom:20%; left:8%; animation-delay:1s; }
    .b5 { width:80px; height:80px; top:15%; left:20%; animation-delay:3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    /* GLASS CARD */
    .glass-card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255,255,255,0.6);
      border-radius: 32px;
      padding: 50px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow:
        0 8px 32px rgba(61,186,135,0.15),
        inset 0 1px 0 rgba(255,255,255,0.8);
    }

    /* LOGO */
    .logo-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 24px;
    }
    .logo-wrap img {
      width: 90px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(61,186,135,0.25);
      position: relative;
      z-index: 2;
    }
    .logo-glow {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(61,186,135,0.3) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      animation: glow 3s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    /* 404 */
    .error-num {
      font-family: 'DM Serif Display', serif;
      font-size: 96px;
      font-weight: 400;
      font-style: italic;
      line-height: 1;
      background: linear-gradient(135deg, #3dba87, #2fa070, #1a8a58);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 12px rgba(61,186,135,0.3));
    }

    /* TITLE */
    .error-title {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      font-weight: 400;
      color: #1a3028;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
      line-height: 1.3;
    }

    /* DESC */
    .error-desc {
      font-size: 13px;
      color: #4a7a65;
      line-height: 1.8;
      margin-bottom: 32px;
    }

    /* BUTTON */
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #3dba87, #2fa070);
      color: #fff;
      text-decoration: none;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 13px 28px;
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(61,186,135,0.4);
      transition: all 0.3s ease;
      letter-spacing: 0.3px;
    }
    .btn-home:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(61,186,135,0.5);
    }
    .btn-home svg {
      width: 16px; height: 16px; fill: #fff;
    }

    /* DIVIDER */
    .divider {
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, #3dba87, transparent);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    /* FOOTER */
    .footer-copy {
      position: fixed;
      bottom: 16px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(26,48,40,0.5);
      font-family: 'Poppins', sans-serif;
      z-index: 5;
    }
  </style>
</head>
<body>

  <!-- BUBBLES -->
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="bubble b5"></div>

  <!-- GLASS CARD -->
  <div class="glass-card">

    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <img src="https://i.imgur.com/TDUfxDZ.png" alt="MKT4X Logo"/>
    </div>

    <div class="error-num">404</div>

    <div class="divider"></div>

    <div class="error-title">Mohon Maaf, Halaman Tidak Ditemukan</div>

    <p class="error-desc">
      Kami tidak dapat menemukan halaman yang Anda cari.<br>
      Mungkin halaman telah dipindahkan, dihapus,<br>
      atau tautan yang Anda buka tidak tersedia.
    </p>

    <a href="/" class="btn-home">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Kembali ke Beranda
    </a>

  </div>
  <div class="footer-copy">Copyright © 2026 MKT4X ENTERTAINMENT All Rights Reserved</div>

</body>
</html>
